<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jarvis">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Jarvis - Assistente Pessoal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        .status.online {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .status.offline {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message.assistant {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        
        #mic-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        #mic-button:active {
            transform: scale(0.95);
        }
        
        #mic-button.listening {
            animation: pulse-mic 1s infinite;
            background: linear-gradient(135deg, #ff4444 0%, #ff6b6b 100%);
        }
        
        @keyframes pulse-mic {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        #text-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        
        #text-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>JARVIS <span class="status online" id="status"></span></h1>
    </div>
    
    <div class="chat-container" id="chat"></div>
    
    <div class="loading" id="loading">
        <span></span>
        <span></span>
        <span></span>
    </div>
    
    <div class="controls">
        <input type="text" id="text-input" placeholder="Digite ou fale sua mensagem...">
        <button id="mic-button">🎤</button>
    </div>

    <script>
        // Configuração
        const API_URL = 'https://seu-dominio.com/chat';  // Alterar para seu domínio
        const API_KEY = 'SUA_API_KEY_AQUI';  // Alterar para sua API Key
        
        // Elementos
        const chat = document.getElementById('chat');
        const textInput = document.getElementById('text-input');
        const micButton = document.getElementById('mic-button');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        
        // Speech Recognition
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;
        
        // Speech Synthesis
        const synth = window.speechSynthesis;
        
        // Estado
        let isListening = false;
        
        // Adicionar mensagem ao chat
        function addMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }
        
        // Falar texto
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.0;
            synth.speak(utterance);
        }
        
        // Enviar mensagem
        async function sendMessage(text) {
            if (!text.trim()) return;
            
            addMessage(text, 'user');
            loading.classList.add('active');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': API_KEY
                    },
                    body: JSON.stringify({ message: text })
                });
                
                if (!response.ok) {
                    throw new Error('Erro na resposta');
                }
                
                const data = await response.json();
                addMessage(data.response, 'assistant');
                speak(data.response);
                
                status.className = 'status online';
            } catch (error) {
                console.error('Erro:', error);
                addMessage('Desculpe, ocorreu um erro. Tente novamente.', 'assistant');
                status.className = 'status offline';
            } finally {
                loading.classList.remove('active');
            }
        }
        
        // Event Listeners
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage(textInput.value);
                textInput.value = '';
            }
        });
        
        micButton.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });
        
        recognition.onstart = () => {
            isListening = true;
            micButton.classList.add('listening');
        };
        
        recognition.onend = () => {
            isListening = false;
            micButton.classList.remove('listening');
        };
        
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            textInput.value = text;
            sendMessage(text);
            textInput.value = '';
        };
        
        recognition.onerror = (event) => {
            console.error('Erro no reconhecimento:', event.error);
            isListening = false;
            micButton.classList.remove('listening');
        };
        
        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
        
        // Mensagem inicial
        addMessage('Olá! Sou o Jarvis, seu assistente pessoal. Como posso ajudar?', 'assistant');
    </script>
</body>
</html>
