<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jarvis">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Jarvis - Assistente Pessoal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            position: relative;
            padding: 20px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        .status.online {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .status.offline {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .message.assistant {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        
        #send-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            color: #fff;
        }
        #send-button:active { transform: scale(0.95); }
        #mic-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        #mic-button:active {
            transform: scale(0.95);
        }
        
        #mic-button.listening {
            animation: pulse-mic 1s infinite;
            background: linear-gradient(135deg, #ff4444 0%, #ff6b6b 100%);
        }
        
        @keyframes pulse-mic {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        #text-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        
        #text-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>JARVIS <span class="status online" id="status"></span></h1>
        <button id="notify-btn" onclick="enableNotifications()" style="position:absolute;left:15px;top:18px;background:none;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 10px;border-radius:15px;font-size:11px;cursor:pointer;display:none;">Ativar Alertas</button>
        <button id="logout-btn" onclick="logout()" style="position:absolute;right:15px;top:18px;background:none;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 12px;border-radius:15px;font-size:12px;cursor:pointer;">Sair</button>
    </div>
    
    <div class="chat-container" id="chat"></div>
    
    <div class="loading" id="loading">
        <span></span>
        <span></span>
        <span></span>
    </div>
    
    <div class="controls">
        <input type="text" id="text-input" placeholder="Digite ou fale sua mensagem...">
        <button id="send-button">➤</button>
        <button id="mic-button">🎤</button>
    </div>

    <script>
        // Configuração
        const API_URL = '/chat';  // Alterar para seu domínio
        const API_KEY = 'b2e926c0585b9d122a321d2c43447a2f164049842be2dd6843a452c251de718c';  // Alterar para sua API Key
        
        // Elementos
        const chat = document.getElementById('chat');
        const textInput = document.getElementById('text-input');
        const micButton = document.getElementById('mic-button');
        const sendButton = document.getElementById('send-button');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        
        // Speech Recognition - usa Web Speech API se disponível, senão grava e envia pro Whisper
        let useWhisper = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recognition = null;
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (!isStandalone) {
            try {
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'pt-BR';
                recognition.continuous = false;
                recognition.interimResults = false;
            } catch(e) {
                useWhisper = true;
            }
        } else {
            useWhisper = true;
        }
        
        // Estado
        let isListening = false;
        let userLat = null, userLon = null;
        
        function updateLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; },
                    () => {}, {enableHighAccuracy: false, timeout: 5000, maximumAge: 300000}
                );
            }
        }
        updateLocation();
        setInterval(updateLocation, 300000);
        
        // Adicionar mensagem ao chat
        function addMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }
        
        // Enviar mensagem
        async function sendMessage(text) {
            if (!text.trim()) return;
            
            addMessage(text, 'user');
            loading.classList.add('active');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': API_KEY
                    },
                    body: JSON.stringify({ message: text, lat: userLat, lon: userLon })
                });
                
                if (!response.ok) {
                    throw new Error('Erro na resposta');
                }
                
                const data = await response.json();
                addMessage(data.response, 'assistant');
                
                status.className = 'status online';
            } catch (error) {
                console.error('Erro:', error);
                addMessage('Desculpe, ocorreu um erro. Tente novamente.', 'assistant');
                status.className = 'status offline';
            } finally {
                loading.classList.remove('active');
            }
        }
        
        // Event Listeners
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage(textInput.value);
                textInput.value = '';
            }
        });
        
        sendButton.addEventListener('click', () => {
            if (textInput.value.trim()) {
                sendMessage(textInput.value);
                textInput.value = '';
            }
        });
        
        async function startWhisperRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({audio: true});
            audioChunks = [];
            mediaRecorder = new MediaRecorder(stream, {mimeType: 'audio/webm'});
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                stream.getTracks().forEach(t => t.stop());
                const blob = new Blob(audioChunks, {type: 'audio/webm'});
                const formData = new FormData();
                formData.append('file', blob, 'audio.webm');
                formData.append('model', 'whisper-1');
                formData.append('language', 'pt');
                micButton.classList.remove('listening');
                isListening = false;
                loading.classList.add('active');
                try {
                    const r = await fetch('/api/transcribe', {
                        method: 'POST',
                        headers: {'X-Api-Key': API_KEY},
                        body: formData
                    });
                    const d = await r.json();
                    if (d.text) {
                        textInput.value = d.text;
                        sendMessage(d.text);
                        textInput.value = '';
                    }
                } catch(e) { console.error('Whisper error:', e); }
                loading.classList.remove('active');
            };
            mediaRecorder.start();
            isListening = true;
            micButton.classList.add('listening');
        }

        micButton.addEventListener('click', () => {
            if (isListening) {
                if (useWhisper && mediaRecorder) { mediaRecorder.stop(); }
                else if (recognition) { recognition.stop(); }
                return;
            }
            if (useWhisper || !recognition) {
                startWhisperRecording();
            } else {
                recognition.start();
            }
        });
        
        if (recognition) {
            recognition.onstart = () => { isListening = true; micButton.classList.add('listening'); };
            recognition.onend = () => { isListening = false; micButton.classList.remove('listening'); };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                textInput.value = text;
                sendMessage(text);
                textInput.value = '';
            };
            recognition.onerror = (event) => {
                console.error('Speech error, switching to Whisper:', event.error);
                isListening = false;
                micButton.classList.remove('listening');
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    useWhisper = true;
                    startWhisperRecording();
                }
            };
        } else { useWhisper = true; }
        
        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
            navigator.serviceWorker.ready.then(reg => { window._swReg = reg; });
        }
        
        function logout() {
            window.location.href = '/api/logout';
        }
        
        // Mostrar botão de notificação se não autorizado
        if ('Notification' in window && Notification.permission === 'default') {
            document.getElementById('notify-btn').style.display = 'block';
        }

        async function enableNotifications() {
            const perm = await Notification.requestPermission();
            if (perm === 'granted' && window._swReg) {
                try {
                    const r = await fetch('/api/vapid-public-key');
                    const {publicKey} = await r.json();
                    const sub = await window._swReg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: Uint8Array.from(atob(publicKey.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))
                    });
                    await fetch('/api/push/subscribe', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(sub.toJSON())
                    });
                    document.getElementById('notify-btn').style.display = 'none';
                    addMessage('Alertas ativados! Vou te notificar sobre emails importantes.', 'assistant');
                } catch(e) { addMessage('Erro ao ativar alertas: ' + e.message, 'assistant'); }
            }
        }

        // Auto-subscribe se já autorizado
        if ('Notification' in window && Notification.permission === 'granted') {
            navigator.serviceWorker.ready.then(async reg => {
                try {
                    const existing = await reg.pushManager.getSubscription();
                    if (existing) {
                        await fetch('/api/push/subscribe', {
                            method: 'POST',
                            headers: {'Content-Type':'application/json'},
                            body: JSON.stringify(existing.toJSON())
                        });
                    } else {
                        const r = await fetch('/api/vapid-public-key');
                        const {publicKey} = await r.json();
                        const sub = await reg.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: Uint8Array.from(atob(publicKey.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))
                        });
                        await fetch('/api/push/subscribe', {
                            method: 'POST',
                            headers: {'Content-Type':'application/json'},
                            body: JSON.stringify(sub.toJSON())
                        });
                    }
                } catch(e) { console.error('Auto-push error:', e); }
            });
        }

        // Mensagem inicial
        addMessage('Oi, como posso te ajudar senhor Marcelo?', 'assistant');
    </script>
</body>
</html>
