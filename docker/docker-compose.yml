services:
  jarvis-db:
    image: pgvector/pgvector:pg15
    container_name: jarvis-db
    restart: always
    environment:
      POSTGRES_DB: personal_kb
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jarvis-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  jarvis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-app
    restart: always
    environment:
      - API_KEY=${API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=jarvis-db
      - REDIS_HOST=jarvis-cache
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - GOOGLE_MAPS_KEY=${GOOGLE_MAPS_KEY}
      - EVO_URL=${EVO_URL}
      - EVO_KEY=${EVO_KEY}
      - EVO_INSTANCE=${EVO_INSTANCE}
      - VAPID_PUBLIC=${VAPID_PUBLIC}
      - VAPID_PRIVATE=${VAPID_PRIVATE}
      - LOGIN_USER=${LOGIN_USER}
      - LOGIN_PASS=${LOGIN_PASS}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      - jarvis-db
      - jarvis-cache
    networks:
      - jarvis-network

  jarvis-cache:
    image: redis:7-alpine
    container_name: jarvis-cache
    restart: always
    volumes:
      - jarvis-cache-data:/data
    networks:
      - jarvis-network
    command: redis-server --appendonly yes

  jarvis-web:
    image: nginx:alpine
    container_name: jarvis-web
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ../pwa:/usr/share/nginx/html/pwa:ro
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - jarvis-app
    networks:
      - jarvis-network

networks:
  jarvis-network:
    driver: bridge

volumes:
  jarvis-db-data:
  jarvis-cache-data:
