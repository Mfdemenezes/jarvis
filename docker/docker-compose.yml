services:
  jarvis-db:
    image: pgvector/pgvector:pg15
    container_name: jarvis-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_kb}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - jarvis-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  jarvis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-app
    restart: always
    environment:
      - TZ=America/Sao_Paulo
      - API_KEY=${API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=jarvis-db
      - REDIS_HOST=jarvis-cache
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - GOOGLE_MAPS_KEY=${GOOGLE_MAPS_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
      - EVO_URL=${EVO_URL}
      - EVO_KEY=${EVO_KEY}
      - EVO_INSTANCE=${EVO_INSTANCE}
      - EVO_PERSONAL_INSTANCE=${EVO_PERSONAL_INSTANCE}
      - EVO_PERSONAL_KEY=${EVO_PERSONAL_KEY}
      - VAPID_PUBLIC=${VAPID_PUBLIC}
      - VAPID_PRIVATE=${VAPID_PRIVATE}
      - LOGIN_USER=${LOGIN_USER}
      - LOGIN_PASS=${LOGIN_PASS}
      - BRAPI_TOKEN=${BRAPI_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - WHATSAPP_GROUP_ID=${WHATSAPP_GROUP_ID}
      - HOME_ADDRESS=${HOME_ADDRESS}
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - APP_DOMAIN=${APP_DOMAIN}
      - POSTGRES_DB=${POSTGRES_DB:-personal_kb}
      - POSTGRES_USER=${POSTGRES_USER:-assistant}
      - DEFAULT_CITY=${DEFAULT_CITY}
      - USER_NAME=${USER_NAME}
      - ASSISTANT_NAME=${ASSISTANT_NAME:-Jarvis}
      # Ajuste dos alertas sem rebuild da imagem
      - VOL_LIMIAR_ALERTA=${VOL_LIMIAR_ALERTA:-2.0}
      - VOL_PIORA_REALERTA=${VOL_PIORA_REALERTA:-1.0}
      - NIVEIS_JANELA_SWING=${NIVEIS_JANELA_SWING:-3}
      - NIVEIS_RETRACAO_MIN=${NIVEIS_RETRACAO_MIN:-1.5}
      - NIVEIS_N_FAIXAS=${NIVEIS_N_FAIXAS:-40}
      - NIVEIS_AREA_VALOR=${NIVEIS_AREA_VALOR:-0.70}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      - jarvis-db
      - jarvis-cache
    networks:
      - jarvis-network

  jarvis-cache:
    image: redis:7-alpine
    container_name: jarvis-cache
    restart: always
    volumes:
      - jarvis-cache-data:/data
    networks:
      - jarvis-network
    command: redis-server --appendonly yes

  jarvis-web:
    image: nginx:alpine
    container_name: jarvis-web
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-apikey.conf:/etc/nginx/apikey.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ../pwa:/usr/share/nginx/html/pwa:ro
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - jarvis-app
    networks:
      - jarvis-network

networks:
  jarvis-network:
    driver: bridge

volumes:
  jarvis-db-data:
  jarvis-cache-data:
