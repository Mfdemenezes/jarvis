events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;

    # Limitar conexões simultâneas
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream jarvis_backend {
        server jarvis-app:8000;
    }

    server {
        listen 80;
        server_name _;

        # Limitar tamanho do body
        client_max_body_size 1m;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; font-src 'self'; worker-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Esconder versão do nginx
        server_tokens off;
        set_real_ip_from 172.0.0.0/8;
        real_ip_header X-Real-IP;

        # Auth via session cookie (gerenciado pelo backend)

        # Limitar conexões por IP
        limit_conn conn_limit 3;

        # Login page
        location = / {
            root /usr/share/nginx/html/pwa;
            try_files /login.html =404;
            expires -1;
            add_header Cache-Control "no-store";
        }

        # PWA app (autenticado)
        location /app {
            root /usr/share/nginx/html/pwa;
            try_files /index.html =404;
            expires -1;
            add_header Cache-Control "no-store";
        }

        # Assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html/pwa;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Login/Logout API
        location /api/login {
            proxy_pass http://jarvis_backend;
            proxy_set_header Host $host;
        }
        location /api/ {
            proxy_pass http://jarvis_backend;
            proxy_set_header Host $host;
            client_max_body_size 10m;
        }
        location /api/logout_old {
            proxy_pass http://jarvis_backend;
            proxy_set_header Host $host;
        }

        # API
        location /chat {
            limit_req zone=api_limit burst=3 nodelay;
            proxy_pass http://jarvis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Arquivos PWA sem auth
        location = /favicon.ico {
            auth_basic off;
            root /usr/share/nginx/html/pwa;
        }
        location = /manifest.json {
            auth_basic off;
            root /usr/share/nginx/html/pwa;
        }
        location = /sw.js {
            auth_basic off;
            root /usr/share/nginx/html/pwa;
            add_header Cache-Control "no-store";
            add_header Content-Security-Policy "";
        }
        location /auth/callback {
            auth_basic off;
            proxy_pass http://jarvis-app:8000;
        }
        location /health {
            limit_req zone=general_limit burst=5 nodelay;
            auth_basic off;
            proxy_pass http://jarvis_backend;
        }

        location /history {
            limit_req zone=api_limit burst=3 nodelay;
            proxy_pass http://jarvis_backend;
        }

        # Bloquear arquivos sensíveis
        location ~ /\. { deny all; }
        location ~ ~$ { deny all; }
    }
}
